; Your Child's First Phone - dialplan.
;
; Buttons and allowed callers are edited in the web page, which stores them in the
; Asterisk database:
;   speed/<digit>      = someone@sip.linphone.org -> call that Linphone user
;   speed/<digit>      = 447700900123             -> call that number through a SIP trunk
;                                                    (endpoint "trunk"; optional, not included)
;   allowedapp/<user>  = name -> this Linphone user may ring the child's phone
;   allowed/<digits>   = name -> this ordinary phone number may ring it (needs the trunk)
;   config/childname   = the child's name, sent as caller ID on outgoing calls

[globals]
KID=kid                 ; the child's phone: must match the endpoint name in pjsip.conf
LPDOMAIN=sip.linphone.org

[from-phone]
; Calls made from the child's phone. 600 = echo test. One digit = one button.
; Anything else gets a busy tone, so nothing but the buttons can be dialled.
exten => 600,1,Answer()
 same => n,Echo()
exten => _X,1,GotoIf($[${DB_EXISTS(speed/${EXTEN})}]?go:nope)
 same => n(go),Set(DEST=${DB_RESULT})
 same => n,Set(CALLERID(name)=${DB(config/childname)})
 same => n,GotoIf($["${CUT(DEST,@,2)}" != ""]?app)
 same => n,GotoIf($[${REGEX("^[0-9]+$" ${DEST})}]?out)
 same => n,Congestion()
 same => n(app),Dial(PJSIP/linphone/sip:${DEST},60)
 same => n,Hangup()
 same => n(out),Dial(PJSIP/${DEST}@trunk,60)
 same => n,Hangup()
 same => n(nope),Congestion()
exten => i,1,Congestion()

[from-linphone]
; Calls arriving from linphone.org. Ring the child's phone only if the caller is
; <someone on the allowed list>@sip.linphone.org. Everyone else is hung up on.
exten => home,1,Set(RU=${CHANNEL(pjsip,remote_uri)})
 same => n,Set(H=${CUT(RU,@,2)})
 same => n,Set(H=${CUT(H,>,1)})
 same => n,Set(H=${CUT(H,\;,1)})
 same => n,Set(H=${CUT(H,:,1)})
 same => n,Set(WHO=${FILTER(a-z0-9._-,${TOLOWER(${CALLERID(num)})})})
 same => n,NoOp(Linphone call from user=${WHO} host=${H})
 same => n,GotoIf($["${H}" != "${LPDOMAIN}"]?no)
 same => n,GotoIf($["${WHO}" = ""]?no)
 same => n,GotoIf($[${DB_EXISTS(allowedapp/${WHO})}]?ok:no)
 same => n(ok),Set(CALLERID(name)=${DB_RESULT})
 same => n,Dial(PJSIP/${KID},45)
 same => n,Hangup()
 same => n(no),Hangup(21)
exten => _[a-zA-Z0-9+].,1,Goto(home,1)
exten => s,1,Goto(home,1)

[from-trunk]
; Optional: calls arriving from a SIP trunk (a real phone number). Not set up by default.
exten => _[+0-9a-zA-Z].,1,Set(CID=${FILTER(0-9,${CALLERID(num)})})
 same => n,GotoIf($["${CID}" = ""]?no)
 same => n,GotoIf($[${DB_EXISTS(allowed/${CID})}]?ok:no)
 same => n(ok),Set(CALLERID(name)=${DB_RESULT})
 same => n,Dial(PJSIP/${KID},45)
 same => n,Hangup()
 same => n(no),Hangup(21)
exten => s,1,Hangup(21)
